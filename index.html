<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPHUB Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --bg: #F5F7F5;
    --surface: #FFFFFF;
    --surface-2: #EDF1EE;
    --ink: #1B2420;
    --muted: #5F6E66;
    --faint: #8B988F;
    --border: #DFE5E0;
    --border-strong: #C6CFC8;
    --accent: #0E7A5C;
    --accent-ink: #FFFFFF;
    --accent-soft: #E1F0E9;
    --crit: #C0392B;
    --crit-soft: #F7E4E1;
    --high: #C46A15;
    --high-soft: #F8EBDC;
    --med: #8A7A12;
    --med-soft: #F2EED3;
    --low: #5C7A6E;
    --low-soft: #E4ECE8;
    --bug: #B03A48;
    --bug-soft: #F6E3E5;
    --enh: #21618C;
    --enh-soft: #E0EBF3;
    --task: #5B5E8D;
    --task-soft: #E6E7F2;
    --overdue: #C0392B;
    --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 4px 14px rgba(20, 30, 25, .07);
    --shadow-lift: 0 2px 6px rgba(20, 30, 25, .10), 0 10px 30px rgba(20, 30, 25, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111613;
      --surface: #1A211D;
      --surface-2: #212A25;
      --ink: #E7EDE9;
      --muted: #9AA9A0;
      --faint: #6E7C74;
      --border: #2A342E;
      --border-strong: #3A463F;
      --accent: #3CB489;
      --accent-ink: #0C1511;
      --accent-soft: #1D3A2F;
      --crit: #E36A5C;
      --crit-soft: #3C2320;
      --high: #E29A4B;
      --high-soft: #3A2C1B;
      --med: #C8B84A;
      --med-soft: #34301A;
      --low: #8FAE9F;
      --low-soft: #24302A;
      --bug: #E07A87;
      --bug-soft: #3A2226;
      --enh: #6FA8D6;
      --enh-soft: #1E2C38;
      --task: #9B9ED2;
      --task-soft: #272939;
      --overdue: #E36A5C;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111613;
    --surface: #1A211D;
    --surface-2: #212A25;
    --ink: #E7EDE9;
    --muted: #9AA9A0;
    --faint: #6E7C74;
    --border: #2A342E;
    --border-strong: #3A463F;
    --accent: #3CB489;
    --accent-ink: #0C1511;
    --accent-soft: #1D3A2F;
    --crit: #E36A5C;
    --crit-soft: #3C2320;
    --high: #E29A4B;
    --high-soft: #3A2C1B;
    --med: #C8B84A;
    --med-soft: #34301A;
    --low: #8FAE9F;
    --low-soft: #24302A;
    --bug: #E07A87;
    --bug-soft: #3A2226;
    --enh: #6FA8D6;
    --enh-soft: #1E2C38;
    --task: #9B9ED2;
    --task-soft: #272939;
    --overdue: #E36A5C;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14.5px/1.5 "Instrument Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  .app[hidden] { display: none; }

  /* ---------- login ---------- */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg);
  }
  .login-wrap[hidden] { display: none; }
  .login-card {
    width: 100%; max-width: 360px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-lift);
    padding: 30px 28px 26px;
  }
  .login-card h1 {
    margin: 0 0 2px;
    font: 700 22px/1.2 "Archivo", system-ui, sans-serif; letter-spacing: -.01em;
  }
  .login-card .sub {
    font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 22px;
  }
  .login-card label {
    display: block; margin: 0 0 5px;
    font: 600 11px "Archivo", sans-serif; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
  }
  .login-card input {
    width: 100%; padding: 9px 12px; margin-bottom: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .login-card .btn.primary { width: 100%; padding: 10px; margin-top: 4px; }
  .login-err {
    color: var(--crit); background: var(--crit-soft);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .login-err[hidden] { display: none; }
  .login-note { margin-top: 16px; font-size: 12px; color: var(--faint); text-align: center; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    margin: 0;
    font: 700 19px/1 "Archivo", system-ui, sans-serif;
    letter-spacing: -.01em;
  }
  .brand .sub {
    font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .stat {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); font-size: 12.5px; color: var(--muted);
  }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat.alert b { color: var(--overdue); }
  .conn { font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .conn.live .dot { background: var(--accent); }
  .conn.err .dot { background: var(--crit); }
  .btn-signout {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
    padding: 5px 12px; font-size: 12.5px; color: var(--muted);
  }
  .btn-signout:hover { color: var(--ink); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .toolbar input[type="search"] {
    flex: 1 1 200px; max-width: 320px;
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg);
  }
  .toolbar select {
    padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--muted); max-width: 160px;
  }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    padding: 7px 14px; border: 0; background: transparent; color: var(--muted); font-weight: 500;
  }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .btn-new {
    margin-left: auto;
    padding: 8px 16px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .btn-new:hover { filter: brightness(1.07); }
  .btn-clear {
    border: 0; background: none; color: var(--muted); font-size: 12.5px;
    text-decoration: underline; padding: 4px;
  }
  .btn-mine {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--muted); font-weight: 500;
  }
  .btn-mine.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn-mine .cnt {
    background: var(--surface-2); border-radius: 999px; padding: 0 7px;
    font: 500 11px "JetBrains Mono", monospace; color: var(--muted);
  }
  .btn-mine.on .cnt { background: var(--accent); color: var(--accent-ink); }
  .btn-mine .cnt.alert { background: var(--high-soft); color: var(--high); }

  .report-item {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; background: var(--surface-2);
  }
  .report-item .rtitle { font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
  .report-item .rdesc { color: var(--muted); font-size: 13px; margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .report-item .rmeta { font-size: 11.5px; color: var(--faint); font-family: "JetBrains Mono", monospace; margin-bottom: 10px; }
  .report-actions { display: flex; gap: 8px; }
  .report-actions .btn { padding: 6px 12px; font-size: 13px; }
  .viewer-note {
    font-size: 12px; color: var(--muted); background: var(--accent-soft);
    border-radius: 8px; padding: 6px 12px;
  }

  /* ---------- board ---------- */
  main { flex: 1; overflow: auto; }
  .board {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 22px 28px; min-height: 100%;
  }
  .col {
    flex: 0 0 292px; max-width: 292px;
    background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; max-height: calc(100vh - 220px);
  }
  .col.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px 9px;
    font: 600 12px/1 "Archivo", system-ui, sans-serif;
    letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  }
  .col-head .count {
    margin-left: auto; font-family: "JetBrains Mono", monospace; font-weight: 400;
    color: var(--faint);
  }
  .col-body { padding: 4px 10px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px;
    padding: 10px 12px 11px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .card:hover { box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
  .card.p-critical { border-left-color: var(--crit); }
  .card.p-high     { border-left-color: var(--high); }
  .card.p-medium   { border-left-color: var(--med); }
  .card.p-low      { border-left-color: var(--low); }
  .card.dragging { opacity: .45; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .card-id { font: 500 11px "JetBrains Mono", monospace; color: var(--faint); }
  .card-title { font-weight: 600; font-size: 14px; line-height: 1.35; margin: 0 0 6px; overflow-wrap: anywhere; }
  .card-desc {
    color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0 0 8px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .row-desc {
    color: var(--muted); font-size: 12px; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px;
  }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 9.5px "Archivo", sans-serif; letter-spacing: .02em;
    flex: none;
  }
  .due { font-family: "JetBrains Mono", monospace; font-size: 11px; }
  .due.overdue { color: var(--overdue); font-weight: 500; }
  .prs { display: inline-flex; align-items: center; gap: 3px; font-family: "JetBrains Mono", monospace; font-size: 11px; }

  .chip {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
  }
  .chip.t-bug         { background: var(--bug-soft);  color: var(--bug); }
  .chip.t-enhancement { background: var(--enh-soft);  color: var(--enh); }
  .chip.t-task        { background: var(--task-soft); color: var(--task); }
  .chip.pr-critical   { background: var(--crit-soft); color: var(--crit); }
  .chip.pr-high       { background: var(--high-soft); color: var(--high); }
  .chip.pr-medium     { background: var(--med-soft);  color: var(--med); }
  .chip.pr-low        { background: var(--low-soft);  color: var(--low); }
  .label-chip {
    background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 999px; font-size: 10.5px;
  }

  .empty-col { color: var(--faint); font-size: 12.5px; text-align: center; padding: 18px 6px; }
  .empty-all {
    max-width: 460px; margin: 80px auto; text-align: center; color: var(--muted);
  }
  .empty-all h2 { font: 600 18px "Archivo", sans-serif; color: var(--ink); margin: 0 0 8px; }

  /* ---------- table ---------- */
  .table-wrap { padding: 16px 22px 30px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left; padding: 10px 12px;
    font: 600 11px "Archivo", sans-serif; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th .arrow { color: var(--accent); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  td.title-cell { font-weight: 500; max-width: 340px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    white-space: nowrap;
  }
  .status-pill .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  /* ---------- drawer ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(10, 16, 13, .45);
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lift);
    transform: translateX(102%); transition: transform .22s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .scrim { transition: none; }
  }
  .drawer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .drawer-head .card-id { font-size: 12px; }
  .drawer-head h2 { margin: 0; font: 600 15px "Archivo", sans-serif; flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 26px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; margin-bottom: 5px;
    font: 600 11px "Archivo", sans-serif; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 11px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .field textarea { resize: vertical; min-height: 84px; }
  input[type="date"] { cursor: pointer; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .8; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pr-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .pr-row input { flex: 1; }
  .pr-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .pr-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); font-family: "JetBrains Mono", monospace; font-size: 12px;
  }
  .pr-item a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .pr-item a:hover { text-decoration: underline; }
  .pr-item button { margin-left: auto; border: 0; background: none; color: var(--faint); font-size: 14px; }
  .pr-item button:hover { color: var(--crit); }

  .drawer-foot {
    display: flex; gap: 10px; align-items: center;
    padding: 13px 20px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); font-weight: 500;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--crit); border-color: var(--crit-soft); background: var(--crit-soft); margin-right: auto; }

  .comments { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 16px; }
  .comments h3 { margin: 0 0 10px; font: 600 12px "Archivo", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment .body { flex: 1; }
  .comment .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .comment .who b { color: var(--ink); font-weight: 600; }
  .comment .when { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--faint); }
  .comment p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment-form { display: flex; gap: 8px; margin-top: 10px; }
  .comment-form textarea { flex: 1; min-height: 40px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); resize: vertical; }

  .meta-line { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--faint); margin-top: 16px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }

  /* ---------- effort chips ---------- */
  .chip.e-small  { background: var(--low-soft);  color: var(--low); }
  .chip.e-medium { background: var(--med-soft);  color: var(--med); }
  .chip.e-large  { background: var(--high-soft); color: var(--high); }
  .chip.e-xlarge { background: var(--crit-soft); color: var(--crit); }

  /* ---------- team ---------- */
  .member-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .member-row:last-child { border-bottom: 0; }
  .member-info { flex: 1; min-width: 0; }
  .member-info .nm { font-weight: 600; }
  .member-info .em { font-size: 12px; color: var(--muted); font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
  .member-row select { padding: 5px 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); font-size: 12.5px; }
  .member-row .rm { border: 0; background: none; color: var(--faint); font-size: 14px; }
  .member-row .rm:hover { color: var(--crit); }
  .team-add { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 16px; }
  .team-note { font-size: 12px; color: var(--faint); margin-top: 14px; line-height: 1.5; }
  .btn-team {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
    padding: 5px 12px; font-size: 12.5px; color: var(--muted);
  }
  .btn-team:hover { color: var(--ink); }

  /* ---------- who-are-you modal ---------- */
  .who-wrap {
    position: fixed; inset: 0; background: rgba(10, 16, 13, .5);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    z-index: 50;
  }
  .who-wrap[hidden] { display: none; }
  .who-card {
    width: 100%; max-width: 340px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-lift); padding: 24px 24px 20px;
  }
  .who-card h2 { margin: 0 0 4px; font: 600 16px "Archivo", sans-serif; }
  .who-card p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .who-card select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 14px; }
  .who-card .btn.primary { width: 100%; }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap" hidden>
  <form class="login-card" id="loginForm">
    <h1>SPHUB Tracker</h1>
    <div class="sub">SP Tech Team</div>
    <div class="login-err" id="loginErr" hidden></div>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPw">Password</label>
    <input id="loginPw" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
    <p class="login-note">Team access only. Ask the SP tech team for credentials.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <header>
    <div class="brand">
      <h1>SPHUB Tracker</h1>
      <span class="sub">SP Tech Team</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="conn" id="conn"><span class="dot"></span><span id="connLabel">connecting…</span></div>
    <button class="btn-team" id="btnTeam">Team</button>
    <button class="btn-team" id="btnPw">Password</button>
    <button class="btn-signout" id="btnSignout">Sign out</button>
  </header>

  <div class="toolbar">
    <button class="btn-mine" id="fMine" aria-pressed="false">My tasks <span class="cnt" id="mineCount">0</span></button>
    <input type="search" id="fSearch" placeholder="Search title, ID, label, PR…">
    <select id="fType">
      <option value="">All types</option>
      <option value="bug">Bug</option>
      <option value="enhancement">Enhancement</option>
      <option value="task">Task</option>
    </select>
    <select id="fPriority">
      <option value="">All priorities</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <select id="fAssignee"><option value="">All assignees</option></select>
    <select id="fStatus">
      <option value="">All statuses</option>
      <option value="backlog">Backlog</option>
      <option value="todo">To do</option>
      <option value="inprogress">In progress</option>
      <option value="inreview">In review</option>
      <option value="done">Done</option>
    </select>
    <button class="btn-clear" id="clearFilters" hidden>Clear filters</button>
    <div class="seg" role="tablist" aria-label="View">
      <button id="viewBoard" class="on" role="tab" aria-selected="true">Board</button>
      <button id="viewTable" role="tab" aria-selected="false">Table</button>
    </div>
    <button class="btn-mine" id="btnReports">CM reports <span class="cnt alert" id="repCount">0</span></button>
    <button class="btn-new" id="btnNew">+ New issue</button>
    <button class="btn-new" id="btnReport" hidden>Report an issue</button>
  </div>

  <main id="main"></main>
</div>

<div class="who-wrap" id="whoWrap" hidden>
  <div class="who-card">
    <h2>Who are you?</h2>
    <p>Pick yourself from the team list — used for reporter, comments, and edit history.</p>
    <select id="whoSelect"></select>
    <button class="btn primary" id="whoConfirm">That's me</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Issue details"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* ---------------- supabase backend ---------------- */
const SUPA_URL = "https://qqhayadsnchhawtbmsqe.supabase.co";
const SUPA_KEY = "sb_publishable_m1-5gQlKXwNW4VsiAg4ang_6WsRWeiG";
const SESSION_KEY = "sphub-tracker-session";
const POLL_MS = 15000;

let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { session = null; }

function saveSession(s) {
  session = s;
  try {
    if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  } catch (e) {}
}

async function authRequest(grant, body) {
  const res = await fetch(SUPA_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { "apikey": SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error_description || data.msg || data.message || ("Sign-in failed (" + res.status + ")");
    throw new Error(msg);
  }
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000,
    email: (data.user && data.user.email) || "",
  };
}

async function ensureToken() {
  if (!session) throw new Error("signed out");
  if (Date.now() < session.expires_at - 60000) return session.access_token;
  try {
    const s = await authRequest("refresh_token", { refresh_token: session.refresh_token });
    saveSession(s);
    return s.access_token;
  } catch (e) {
    signOut();
    throw new Error("Session expired — please sign in again");
  }
}

async function api(path, opts) {
  const token = await ensureToken();
  opts = opts || {};
  opts.headers = Object.assign({
    "apikey": SUPA_KEY,
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json",
  }, opts.headers || {});
  const res = await fetch(SUPA_URL + "/rest/v1/" + path, opts);
  if (res.status === 401) { signOut(); throw new Error("Session expired — please sign in again"); }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.message || ("Request failed (" + res.status + ")"));
  }
  if (res.status === 204 || (opts.headers.Prefer || "").includes("return=minimal")) return null;
  return res.json();
}

const store = {
  async loadAll() {
    const rows = await api("issues?select=id,data&order=id.asc");
    return rows.map(r => Object.assign({ id: r.id }, r.data));
  },
  save(id, data) {
    return api("issues?on_conflict=id", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ id, data, updated_at: new Date().toISOString() }]),
    });
  },
  remove(id) {
    return api("issues?id=eq." + encodeURIComponent(id), {
      method: "DELETE",
      headers: { "Prefer": "return=minimal" },
    });
  },
  loadMembers() {
    return api("members?select=email,name,notify_frequency&order=name.asc");
  },
  saveMember(m) {
    return api("members?on_conflict=email", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([m]),
    });
  },
  removeMember(email) {
    return api("members?email=eq." + encodeURIComponent(email), {
      method: "DELETE",
      headers: { "Prefer": "return=minimal" },
    });
  },
  myRole() {
    return api("rpc/my_role", { method: "POST", body: "{}" });
  },
  loadReports() {
    return api("reports?status=eq.pending&select=*&order=created_at.asc");
  },
  addReport(r) {
    return api("reports", {
      method: "POST",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify([r]),
    });
  },
  updateReport(id, patch) {
    return api("reports?id=eq." + encodeURIComponent(id), {
      method: "PATCH",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify(patch),
    });
  },
  loadRoles() {
    return api("roles?select=email,role&order=email.asc");
  },
  saveRole(email, roleValue) {
    return api("roles?on_conflict=email", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ email, role: roleValue }]),
    });
  },
  removeRole(email) {
    return api("roles?email=eq." + encodeURIComponent(email), {
      method: "DELETE",
      headers: { "Prefer": "return=minimal" },
    });
  },
  async changePassword(newPassword) {
    const token = await ensureToken();
    const res = await fetch(SUPA_URL + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ password: newPassword }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error_description || data.msg || data.message || ("Password change failed (" + res.status + ")"));
  },
};

/* ---------------- auth flow ---------------- */
function showLogin() {
  document.getElementById("app").hidden = true;
  document.getElementById("loginWrap").hidden = false;
}
function showApp() {
  document.getElementById("loginWrap").hidden = true;
  document.getElementById("app").hidden = false;
}
function signOut() {
  saveSession(null);
  stopPolling();
  issues = [];
  showLogin();
}

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginErr");
  errEl.hidden = true;
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    const s = await authRequest("password", {
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPw").value,
    });
    saveSession(s);
    enterApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

document.getElementById("btnSignout").addEventListener("click", signOut);

/* ---------------- sync ---------------- */
let pollTimer = null;

function setConn(mode, label) {
  const el = document.getElementById("conn");
  el.classList.remove("live", "err");
  if (mode) el.classList.add(mode);
  document.getElementById("connLabel").textContent = label;
}

async function refresh(showErrors) {
  try {
    const [iss, mem, rep] = await Promise.all([store.loadAll(), store.loadMembers(), store.loadReports()]);
    issues = iss;
    members = mem;
    reports = rep;
    setConn("live", "team sync on");
    render();
    ensureIdentity();
  } catch (err) {
    setConn("err", "sync error");
    if (showErrors) toast(err.message);
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && session) refresh(false);
});

function enterApp() {
  showApp();
  setConn("", "loading…");
  fetchRole().then(() => refresh(true));
  startPolling();
}

/* ---------------- role ---------------- */
let role = "viewer"; // until the server says otherwise

async function fetchRole() {
  try { role = (await store.myRole()) === "editor" ? "editor" : "viewer"; }
  catch (e) { role = "viewer"; }
  applyRole();
}

function applyRole() {
  const editor = role === "editor";
  $("#btnNew").hidden = !editor;
  $("#btnTeam").hidden = !editor;
  $("#btnReport").hidden = editor;
  $("#fMine").hidden = !editor;
}

/* ---------------- identity ---------------- */
let members = [];
let me = null;
try { me = JSON.parse(localStorage.getItem("sphub-tracker-me") || "null"); } catch (e) { me = null; }

function myName() { return me ? me.name : "Unknown"; }

function ensureIdentity() {
  if (role !== "editor") { $("#whoWrap").hidden = true; return; }
  if (!members.length) return; // team empty — nothing to pick yet
  if (me && members.some(m => m.email === me.email)) { $("#whoWrap").hidden = true; return; }
  const sel = $("#whoSelect");
  sel.innerHTML = members.map(m =>
    '<option value="' + esc(m.email) + '">' + esc(m.name) + " — " + esc(m.email) + "</option>").join("");
  $("#whoWrap").hidden = false;
}

document.getElementById("whoConfirm").addEventListener("click", () => {
  const m = members.find(x => x.email === document.getElementById("whoSelect").value);
  if (!m) return;
  me = { name: m.name, email: m.email };
  try { localStorage.setItem("sphub-tracker-me", JSON.stringify(me)); } catch (e) {}
  $("#whoWrap").hidden = true;
  toast("Signed in as " + m.name);
});

/* ---------------- constants ---------------- */
const STATUSES = [
  { key: "backlog",    name: "Backlog",     dot: "var(--faint)" },
  { key: "todo",       name: "To do",       dot: "var(--task)" },
  { key: "inprogress", name: "In progress", dot: "var(--high)" },
  { key: "inreview",   name: "In review",   dot: "var(--enh)" },
  { key: "done",       name: "Done",        dot: "var(--accent)" },
];
const PRIORITIES = ["critical", "high", "medium", "low"];
const PRIORITY_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
const TYPES = { bug: "Bug", enhancement: "Enhancement", task: "Task" };
const EFFORTS = {
  small:  { short: "S",  name: "Small — quick fix" },
  medium: { short: "M",  name: "Medium — a day or two" },
  large:  { short: "L",  name: "Large — hard / multi-day" },
  xlarge: { short: "XL", name: "X-Large — very hard / long haul" },
};
const EFFORT_RANK = { small: 0, medium: 1, large: 2, xlarge: 3 };

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = iso => {
  if (!iso) return "";
  const d = new Date(iso + (iso.length === 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const fmtDateTime = ts => {
  if (!ts) return "";
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const initials = name => (name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const isOverdue = it => it.dueDate && it.status !== "done" && it.dueDate < todayISO();

let issues = [];
let reports = [];

function nextId() {
  let max = 0;
  for (const it of issues) {
    const m = /^SPH-(\d+)$/.exec(it.id);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return "SPH-" + (max + 1);
}

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function prHTML(pr) {
  const safe = esc(pr);
  if (/^https?:\/\//i.test(pr)) {
    let label = safe;
    const gh = /github\.com\/([^\/]+\/[^\/]+)\/pull\/(\d+)/i.exec(pr);
    if (gh) label = esc(gh[1] + "#" + gh[2]);
    return '<a href="' + safe + '" target="_blank" rel="noopener">' + label + "</a>";
  }
  return "<span>" + safe + "</span>";
}

/* ---------------- state ---------------- */
let view = "board";
let sortKey = "priority", sortDir = 1;
const filters = { q: "", type: "", priority: "", assignee: "", status: "", mine: false };

function isMine(it) {
  if (!me) return false;
  return it.assigneeEmail === me.email || (!it.assigneeEmail && it.assignee && it.assignee === me.name);
}

function filtered() {
  const q = filters.q.trim().toLowerCase();
  return issues.filter(it => {
    if (filters.mine && !isMine(it)) return false;
    if (filters.type && it.type !== filters.type) return false;
    if (filters.priority && it.priority !== filters.priority) return false;
    if (filters.assignee && (it.assignee || "") !== filters.assignee) return false;
    if (filters.status && it.status !== filters.status) return false;
    if (q) {
      const hay = [it.id, it.title, it.description, it.assignee, (it.labels || []).join(" "), (it.prs || []).join(" ")]
        .join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------------- render ---------------- */
function render() {
  renderStats();
  renderAssigneeFilter();
  const openMine = issues.filter(it => isMine(it) && it.status !== "done").length;
  $("#mineCount").textContent = openMine;
  $("#repCount").textContent = reports.length;
  $("#fMine").classList.toggle("on", filters.mine);
  $("#fMine").setAttribute("aria-pressed", String(filters.mine));
  $("#clearFilters").hidden = !(filters.q || filters.type || filters.priority || filters.assignee || filters.status || filters.mine);
  if (view === "board") renderBoard(); else renderTable();
}

function renderStats() {
  const open = issues.filter(i => i.status !== "done");
  const overdue = issues.filter(isOverdue);
  const crit = open.filter(i => i.priority === "critical");
  const wip = issues.filter(i => i.status === "inprogress" || i.status === "inreview");
  $("#stats").innerHTML =
    '<span class="stat">Open <b>' + open.length + "</b></span>" +
    '<span class="stat">In flight <b>' + wip.length + "</b></span>" +
    '<span class="stat' + (crit.length ? " alert" : "") + '">Critical <b>' + crit.length + "</b></span>" +
    '<span class="stat' + (overdue.length ? " alert" : "") + '">Overdue <b>' + overdue.length + "</b></span>" +
    '<span class="stat">Done <b>' + (issues.length - open.length) + "</b></span>";
}

function renderAssigneeFilter() {
  const sel = $("#fAssignee");
  const cur = filters.assignee;
  const names = [...new Set(issues.map(i => i.assignee).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  sel.innerHTML = '<option value="">All assignees</option>' +
    names.map(n => '<option value="' + esc(n) + '"' + (n === cur ? " selected" : "") + ">" + esc(n) + "</option>").join("");
}

function cardHTML(it) {
  const labels = (it.labels || []).slice(0, 3).map(l => '<span class="label-chip">' + esc(l) + "</span>").join("");
  const due = it.dueDate
    ? '<span class="due' + (isOverdue(it) ? " overdue" : "") + '" title="Due date">◷ ' + fmtDate(it.dueDate) + "</span>"
    : "";
  const prs = (it.prs || []).length
    ? '<span class="prs" title="Linked PRs">⎇ ' + it.prs.length + "</span>"
    : "";
  const who = it.assignee
    ? '<span class="avatar" title="' + esc(it.assignee) + '">' + esc(initials(it.assignee)) + "</span>"
    : "";
  const desc = it.description
    ? '<p class="card-desc">' + esc(it.description) + "</p>"
    : "";
  return '<article class="card p-' + esc(it.priority) + '" draggable="' + (role === "editor" ? "true" : "false") + '" data-id="' + esc(it.id) + '" tabindex="0" ' +
    'aria-label="' + esc(it.id + " " + it.title) + '">' +
    '<div class="card-top">' +
    '<span class="chip t-' + esc(it.type) + '">' + esc(TYPES[it.type] || it.type) + "</span>" +
    '<span class="chip pr-' + esc(it.priority) + '">' + esc(it.priority) + "</span>" +
    (it.effort && EFFORTS[it.effort] ? '<span class="chip e-' + esc(it.effort) + '" title="' + esc(EFFORTS[it.effort].name) + '">' + EFFORTS[it.effort].short + "</span>" : "") +
    "</div>" +
    '<p class="card-title">' + esc(it.title) + "</p>" +
    desc +
    '<div class="card-meta">' + who + due + prs + labels + "</div></article>";
}

function renderBoard() {
  const list = filtered();
  if (!issues.length) {
    $("#main").innerHTML =
      '<div class="empty-all"><h2>No issues yet</h2>' +
      "<p>Track SPHUB bugs and enhancements here — priorities, due dates, owners, and the PRs that ship them.</p>" +
      '<p><button class="btn primary" onclick="openDrawer(null)">Create the first issue</button></p></div>';
    return;
  }
  const sorter = (a, b) =>
    (PRIORITY_RANK[a.priority] ?? 9) - (PRIORITY_RANK[b.priority] ?? 9) ||
    (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
  $("#main").innerHTML = '<div class="board">' + STATUSES.map(st => {
    const items = list.filter(i => i.status === st.key).sort(sorter);
    return '<section class="col" data-status="' + st.key + '">' +
      '<div class="col-head"><span class="sdot" style="width:8px;height:8px;border-radius:50%;background:' + st.dot + '"></span>' +
      esc(st.name) + '<span class="count">' + items.length + "</span></div>" +
      '<div class="col-body">' +
      (items.length ? items.map(cardHTML).join("") : '<div class="empty-col">—</div>') +
      "</div></section>";
  }).join("") + "</div>";
  wireBoard();
}

function wireBoard() {
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openDrawer(el.dataset.id));
    el.addEventListener("keydown", e => { if (e.key === "Enter") openDrawer(el.dataset.id); });
    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", el.dataset.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", () => col.classList.remove("dragover"));
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("dragover");
      const id = e.dataTransfer.getData("text/plain");
      moveIssue(id, col.dataset.status);
    });
  });
}

function moveIssue(id, status) {
  if (role !== "editor") { toast("View-only account — you can report issues, not change them"); return; }
  const it = issues.find(i => i.id === id);
  if (!it || it.status === status) return;
  it.status = status;
  it.updatedAt = new Date().toISOString();
  it.updatedBy = myName();
  const data = Object.assign({}, it);
  delete data.id;
  store.save(id, data).catch(err => toast("Save failed: " + err.message));
  render();
}

const TABLE_COLS = [
  ["id", "ID"], ["title", "Title"], ["type", "Type"], ["priority", "Priority"], ["effort", "Effort"],
  ["status", "Status"], ["assignee", "Assignee"], ["dueDate", "Due"], ["prs", "PRs"], ["updatedAt", "Updated"],
];

function renderTable() {
  const list = filtered().slice().sort((a, b) => {
    let va, vb;
    if (sortKey === "priority") { va = PRIORITY_RANK[a.priority] ?? 9; vb = PRIORITY_RANK[b.priority] ?? 9; }
    else if (sortKey === "effort") { va = EFFORT_RANK[a.effort] ?? 9; vb = EFFORT_RANK[b.effort] ?? 9; }
    else if (sortKey === "prs") { va = (a.prs || []).length; vb = (b.prs || []).length; }
    else if (sortKey === "status") {
      va = STATUSES.findIndex(s => s.key === a.status); vb = STATUSES.findIndex(s => s.key === b.status);
    }
    else if (sortKey === "id") {
      va = parseInt((a.id.match(/\d+/) || [0])[0], 10); vb = parseInt((b.id.match(/\d+/) || [0])[0], 10);
    }
    else { va = a[sortKey] || ""; vb = b[sortKey] || ""; }
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
  const head = TABLE_COLS.map(([k, label]) =>
    "<th data-key=\"" + k + "\">" + label + (sortKey === k ? ' <span class="arrow">' + (sortDir === 1 ? "▲" : "▼") + "</span>" : "") + "</th>"
  ).join("");
  const rows = list.map(it => {
    const st = STATUSES.find(s => s.key === it.status) || STATUSES[0];
    return '<tr data-id="' + esc(it.id) + '">' +
      '<td class="mono">' + esc(it.id) + "</td>" +
      '<td class="title-cell">' + esc(it.title) +
      (it.description ? '<div class="row-desc">' + esc(it.description) + "</div>" : "") + "</td>" +
      '<td><span class="chip t-' + esc(it.type) + '">' + esc(TYPES[it.type] || it.type) + "</span></td>" +
      '<td><span class="chip pr-' + esc(it.priority) + '">' + esc(it.priority) + "</span></td>" +
      "<td>" + (it.effort && EFFORTS[it.effort] ? '<span class="chip e-' + esc(it.effort) + '" title="' + esc(EFFORTS[it.effort].name) + '">' + EFFORTS[it.effort].short + "</span>" : '<span style="color:var(--faint)">—</span>') + "</td>" +
      '<td><span class="status-pill"><span class="sdot" style="background:' + st.dot + '"></span>' + esc(st.name) + "</span></td>" +
      "<td>" + (it.assignee ? '<span class="avatar" style="margin-right:6px">' + esc(initials(it.assignee)) + "</span>" + esc(it.assignee) : '<span style="color:var(--faint)">—</span>') + "</td>" +
      '<td class="mono' + (isOverdue(it) ? '" style="color:var(--overdue)' : "") + '">' + (it.dueDate ? fmtDate(it.dueDate) : "—") + "</td>" +
      '<td class="mono">' + ((it.prs || []).length || "—") + "</td>" +
      '<td class="mono">' + fmtDateTime(it.updatedAt || it.createdAt) + "</td></tr>";
  }).join("");
  $("#main").innerHTML = '<div class="table-wrap"><table><thead><tr>' + head + "</tr></thead><tbody>" +
    (rows || '<tr><td colspan="10" style="text-align:center;color:var(--faint);padding:26px">No issues match the current filters.</td></tr>') +
    "</tbody></table></div>";
  document.querySelectorAll("thead th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    renderTable();
  }));
  document.querySelectorAll("tbody tr[data-id]").forEach(tr =>
    tr.addEventListener("click", () => openDrawer(tr.dataset.id)));
}

/* ---------------- drawer ---------------- */
let drawerPRs = [];
let drawerId = null;

function openDrawer(id) {
  drawerId = id;
  const it = id ? issues.find(i => i.id === id) : null;
  drawerPRs = it ? (it.prs || []).slice() : [];

  const comments = (it && it.comments || []).map(c =>
    '<div class="comment"><span class="avatar">' + esc(initials(c.author)) + '</span><div class="body">' +
    '<div class="who"><b>' + esc(c.author) + '</b> <span class="when">' + esc(fmtDateTime(c.at)) + "</span></div>" +
    "<p>" + esc(c.text) + "</p></div></div>"
  ).join("") || '<p style="color:var(--faint);font-size:13px">No comments yet.</p>';

  $("#drawer").innerHTML =
    '<div class="drawer-head">' +
    (it ? '<span class="card-id">' + esc(it.id) + "</span>" : "") +
    "<h2>" + (it ? "Edit issue" : "New issue") + "</h2>" +
    '<button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>' +
    '<div class="drawer-body">' +
    '<div class="field"><label for="dTitle">Title</label><input id="dTitle" value="' + esc(it ? it.title : "") + '" placeholder="The required action in one statement — e.g. Fix session timeout on the SPHUB dashboard"></div>' +
    '<div class="field"><label for="dDesc">Description</label><textarea id="dDesc" placeholder="What is broken / what should improve, where in SPHUB, acceptance criteria…">' + esc(it ? it.description : "") + "</textarea></div>" +
    '<div class="grid2">' +
    '<div class="field"><label for="dType">Type</label><select id="dType">' +
    Object.entries(TYPES).map(([k, v]) => '<option value="' + k + '"' + (it && it.type === k ? " selected" : "") + ">" + v + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label for="dPriority">Priority</label><select id="dPriority">' +
    PRIORITIES.map(p => '<option value="' + p + '"' + ((it ? it.priority : "medium") === p ? " selected" : "") + ">" + p[0].toUpperCase() + p.slice(1) + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label for="dStatus">Status</label><select id="dStatus">' +
    STATUSES.map(s => '<option value="' + s.key + '"' + ((it ? it.status : "todo") === s.key ? " selected" : "") + ">" + s.name + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label for="dAssignee">Assignee</label><select id="dAssignee">' +
    '<option value="">Unassigned</option>' +
    members.map(m => '<option value="' + esc(m.email) + '"' + (it && it.assigneeEmail === m.email ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label for="dEffort">Effort</label><select id="dEffort">' +
    '<option value="">Not sized</option>' +
    Object.entries(EFFORTS).map(([k, v]) => '<option value="' + k + '"' + (it && it.effort === k ? " selected" : "") + ">" + v.name + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label for="dDue">Due date</label><input type="date" id="dDue" value="' + esc(it ? it.dueDate || "" : "") + '"></div>' +
    '<div class="field"><label for="dLabels">Labels</label><input id="dLabels" value="' + esc(it && it.labels ? it.labels.join(", ") : "") + '" placeholder="ui, auth, perf (comma-separated)"></div>' +
    "</div>" +
    '<div class="field"><label for="dPrInput">Linked PRs</label>' +
    '<div class="pr-row"><input id="dPrInput" placeholder="PR URL or #123"><button class="btn" id="dPrAdd">Add</button></div>' +
    '<div class="pr-list" id="dPrList"></div></div>' +
    (it ?
      '<div class="comments"><h3>Comments</h3>' + comments +
      '<div class="comment-form"><textarea id="dComment" placeholder="Add a comment…"></textarea><button class="btn" id="dCommentAdd">Post</button></div></div>' +
      '<div class="meta-line">Reported by ' + esc(it.reporter || "unknown") + " · created " + esc(fmtDateTime(it.createdAt)) +
      (it.updatedAt ? " · updated " + esc(fmtDateTime(it.updatedAt)) + (it.updatedBy ? " by " + esc(it.updatedBy) : "") : "") + "</div>"
      : "") +
    "</div>" +
    '<div class="drawer-foot">' +
    (it ? '<button class="btn danger" id="dDelete">Delete</button>' : "") +
    '<button class="btn" id="dCancel" style="margin-left:auto">Cancel</button>' +
    '<button class="btn primary" id="dSave">' + (it ? "Save changes" : "Create issue") + "</button></div>";

  renderPRList();
  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#dTitle").focus();

  if (role !== "editor") {
    document.querySelectorAll("#drawer .drawer-body input, #drawer .drawer-body select, #drawer .drawer-body textarea")
      .forEach(el => { el.disabled = true; });
    ["dPrAdd", "dSave", "dDelete", "dCommentAdd"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.hidden = true;
    });
    document.querySelectorAll("#dPrList button").forEach(b => { b.hidden = true; });
    $("#dCancel").textContent = "Close";
  }

  $("#dClose").onclick = closeDrawer;
  $("#dCancel").onclick = closeDrawer;
  $("#dPrAdd").onclick = addPR;
  $("#dPrInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addPR(); } });
  $("#dSave").onclick = saveDrawer;
  if (it) {
    $("#dDelete").onclick = () => {
      if (!confirm("Delete " + it.id + " permanently?")) return;
      store.remove(it.id).then(() => toast(it.id + " deleted")).catch(err => toast("Delete failed: " + err.message));
      issues = issues.filter(i => i.id !== it.id);
      closeDrawer(); render();
    };
    $("#dCommentAdd").onclick = () => {
      const txt = $("#dComment").value.trim();
      if (!txt) return;
      const cur = issues.find(i => i.id === it.id) || it;
      cur.comments = (cur.comments || []).concat([{ author: myName(), text: txt, at: new Date().toISOString() }]);
      cur.updatedAt = new Date().toISOString();
      cur.updatedBy = myName();
      const data = Object.assign({}, cur);
      delete data.id;
      store.save(it.id, data).catch(err => toast("Save failed: " + err.message));
      openDrawer(it.id);
    };
  }
}

function addPR() {
  const v = $("#dPrInput").value.trim();
  if (!v) return;
  drawerPRs.push(v);
  $("#dPrInput").value = "";
  renderPRList();
}

function renderPRList() {
  $("#dPrList").innerHTML = drawerPRs.map((pr, i) =>
    '<div class="pr-item">' + prHTML(pr) + '<button data-i="' + i + '" aria-label="Remove PR link">✕</button></div>'
  ).join("");
  document.querySelectorAll("#dPrList button").forEach(b =>
    b.addEventListener("click", () => { drawerPRs.splice(+b.dataset.i, 1); renderPRList(); }));
}

function saveDrawer() {
  const title = $("#dTitle").value.trim();
  if (!title) { toast("A title is required"); $("#dTitle").focus(); return; }
  const pending = $("#dPrInput").value.trim();
  if (pending) drawerPRs.push(pending);
  const existing = drawerId ? issues.find(i => i.id === drawerId) : null;
  const now = new Date().toISOString();
  const assigneeEmail = $("#dAssignee").value;
  const assigneeMember = members.find(m => m.email === assigneeEmail);
  const data = {
    title,
    description: $("#dDesc").value.trim(),
    type: $("#dType").value,
    priority: $("#dPriority").value,
    effort: $("#dEffort").value || "",
    status: $("#dStatus").value,
    assignee: assigneeMember ? assigneeMember.name : "",
    assigneeEmail: assigneeMember ? assigneeMember.email : "",
    dueDate: $("#dDue").value || "",
    labels: $("#dLabels").value.split(",").map(s => s.trim()).filter(Boolean),
    prs: drawerPRs.slice(),
    comments: existing ? existing.comments || [] : [],
    reporter: existing ? existing.reporter || myName() : myName(),
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
    updatedBy: myName(),
  };
  const id = drawerId || nextId();
  store.save(id, data).then(
    () => toast(drawerId ? id + " saved" : id + " created"),
    err => toast("Save failed: " + err.message)
  );
  const idx = issues.findIndex(i => i.id === id);
  const merged = Object.assign({ id }, data);
  if (idx >= 0) issues[idx] = merged; else issues.push(merged);
  closeDrawer();
  render();
}

function closeDrawer() {
  drawerId = null;
  $("#scrim").classList.remove("open");
  $("#drawer").classList.remove("open");
}

/* ---------------- team drawer ---------------- */
const FREQS = [
  ["instant", "Instant (within ~5 min)"],
  ["hourly", "Hourly digest"],
  ["daily", "Daily digest"],
  ["off", "No emails"],
];

function freqSelectHTML(id, current) {
  return '<select id="' + id + '" aria-label="Email frequency">' +
    FREQS.map(([k, v]) => '<option value="' + k + '"' + (current === k ? " selected" : "") + ">" + v + "</option>").join("") +
    "</select>";
}

async function openTeamDrawer() {
  drawerId = null;
  let rolesList = [];
  try { rolesList = await store.loadRoles(); } catch (e) { rolesList = []; }
  const myEmail = (session && session.email || "").toLowerCase();

  const accessRows = rolesList.map((r, i) => {
    const self = r.email.toLowerCase() === myEmail;
    return '<div class="member-row">' +
      '<div class="member-info"><div class="em">' + esc(r.email) + (self ? ' <span style="color:var(--accent)">(you)</span>' : "") + "</div></div>" +

      "</div>";
  }).join("") || '<p style="color:var(--faint);font-size:13px">No access rules yet.</p>';

  const rows = members.map((m, i) =>
    '<div class="member-row">' +
    '<span class="avatar">' + esc(initials(m.name)) + "</span>" +
    '<div class="member-info"><div class="nm">' + esc(m.name) + '</div><div class="em">' + esc(m.email) + "</div></div>" +
    freqSelectHTML("mFreq-" + i, m.notify_frequency) +
    '<button class="rm" data-email="' + esc(m.email) + '" aria-label="Remove member">✕</button>' +
    "</div>"
  ).join("") || '<p style="color:var(--faint);font-size:13px">No team members yet — add the first one below.</p>';

  $("#drawer").innerHTML =
    '<div class="drawer-head"><h2>Team</h2>' +
    '<button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>' +
    '<div class="drawer-body">' + rows +
    '<div class="team-add">' +
    '<div class="field"><label for="mName">Name</label><input id="mName" placeholder="e.g. Yousef Alqufaidi"></div>' +
    '<div class="field"><label for="mEmail">Email</label><input id="mEmail" type="email" placeholder="name@saudipanther.sa"></div>' +
    '<div class="field"><label for="mFreqNew">Email frequency</label>' + freqSelectHTML("mFreqNew", "instant") + "</div>" +
    '<button class="btn primary" id="mAdd">Add member</button></div>' +
    '<p class="team-note">Members appear in the assignee dropdown. When an issue is assigned to someone, they get an email at their chosen frequency (digests bundle multiple assignments into one email).</p>' +
    '<div class="team-add"><div class="field"><label>Account access</label></div>' +
    accessRows +
    '<div class="field" style="margin-top:14px"><label for="aEmail">Account email</label><input id="aEmail" type="email" placeholder="login email of the account"></div>' +
    '<div class="field"><label for="aRoleNew">Access level</label><select id="aRoleNew">' +
    '<option value="editor">Editor — full control</option>' +
    '<option value="viewer">Viewer — read-only + can report</option></select></div>' +
    '<button class="btn" id="aAdd">Set access</button>' +
    '<p class="team-note">These rules apply to login accounts. Any account with no rule here is a viewer by default, so you only need entries for editors (or to pin someone explicitly to viewer). You cannot change your own access, and the last editor can never be removed.</p>' +
    "</div></div>" +
    '<div class="drawer-foot"><button class="btn" id="dCancel" style="margin-left:auto">Close</button></div>';

  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#dClose").onclick = closeDrawer;
  $("#dCancel").onclick = closeDrawer;

  members.forEach((m, i) => {
    const sel = document.getElementById("mFreq-" + i);
    sel.addEventListener("change", () => {
      store.saveMember({ email: m.email, name: m.name, notify_frequency: sel.value })
        .then(() => { m.notify_frequency = sel.value; toast(m.name + ": " + sel.options[sel.selectedIndex].text); })
        .catch(err => toast("Save failed: " + err.message));
    });
  });
  document.querySelectorAll("#drawer .rm").forEach(b =>
    b.addEventListener("click", () => {
      const email = b.dataset.email;
      const m = members.find(x => x.email === email);
      if (!confirm("Remove " + (m ? m.name : email) + " from the team?")) return;
      store.removeMember(email)
        .then(() => {
          members = members.filter(x => x.email !== email);
          toast("Member removed");
          openTeamDrawer();
        })
        .catch(err => toast("Remove failed: " + err.message));
    }));
  rolesList.forEach((r, i) => {
    const sel = document.getElementById("aRole-" + i);
    if (!sel || sel.disabled) return;
    sel.addEventListener("change", () => {
      store.saveRole(r.email, sel.value)
        .then(() => toast(r.email + " is now " + sel.value))
        .catch(err => { toast("Change failed: " + err.message); openTeamDrawer(); });
    });
  });
  document.querySelectorAll("#drawer [data-roleemail]").forEach(b =>
    b.addEventListener("click", () => {
      const email = b.dataset.roleemail;
      if (!confirm("Remove the access rule for " + email + "? The account becomes a viewer.")) return;
      store.removeRole(email)
        .then(() => { toast("Access rule removed"); openTeamDrawer(); })
        .catch(err => toast("Remove failed: " + err.message));
    }));

    const email = $("#aEmail").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("Enter the account's login email"); return; }
    if (email === myEmail) { toast("You cannot change your own access"); return; }
    store.saveRole(email, $("#aRoleNew").value)
      .then(() => { toast(email + " set to " + $("#aRoleNew").value); openTeamDrawer(); })
      .catch(err => toast("Save failed: " + err.message));
  };

  $("#mAdd").onclick = () => {
    const name = $("#mName").value.trim();
    const email = $("#mEmail").value.trim().toLowerCase();
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("A name and a valid email are required"); return; }
    const m = { email, name, notify_frequency: $("#mFreqNew").value };
    store.saveMember(m)
      .then(() => {
        members = members.filter(x => x.email !== email).concat([m]).sort((a, b) => a.name.localeCompare(b.name));
        toast(name + " added");
        openTeamDrawer();
      })
      .catch(err => toast("Add failed: " + err.message));
  };
}

/* ---------------- CM reports ---------------- */
function openReportsDrawer() {
  drawerId = null;
  const editor = role === "editor";
  const items = reports.map(r =>
    '<div class="report-item">' +
    '<p class="rtitle">' + esc(r.title) + "</p>" +
    (r.description ? '<p class="rdesc">' + esc(r.description) + "</p>" : "") +
    '<div class="rmeta">' + esc(TYPES[r.kind] || r.kind) + " · reported by " + esc(r.reporter_name || "anonymous") +
    " · " + esc(fmtDateTime(r.created_at)) + "</div>" +
    (editor
      ? '<div class="report-actions">' +
        '<button class="btn primary" data-accept="' + r.id + '">Accept as issue</button>' +
        '<button class="btn" data-dismiss="' + r.id + '">Dismiss</button></div>'
      : "") +
    "</div>"
  ).join("") || '<p style="color:var(--faint);font-size:13px">No pending reports — the pool is clear.</p>';

  $("#drawer").innerHTML =
    '<div class="drawer-head"><h2>Reported issues from CMs</h2>' +
    '<button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>' +
    '<div class="drawer-body">' +
    (editor ? '<p class="viewer-note" style="margin:0 0 14px">Accepting a report creates a real issue in the Backlog; dismissing removes it from the pool.</p>' : "") +
    items + "</div>" +
    '<div class="drawer-foot"><button class="btn" id="dCancel" style="margin-left:auto">Close</button></div>';

  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#dClose").onclick = closeDrawer;
  $("#dCancel").onclick = closeDrawer;

  document.querySelectorAll("#drawer [data-accept]").forEach(b => b.addEventListener("click", () => {
    const r = reports.find(x => String(x.id) === b.dataset.accept);
    if (!r) return;
    const now = new Date().toISOString();
    const id = nextId();
    const data = {
      title: r.title,
      description: r.description || "",
      type: r.kind === "enhancement" ? "enhancement" : "bug",
      priority: "medium",
      effort: "",
      status: "backlog",
      assignee: "", assigneeEmail: "",
      dueDate: "", labels: ["cm-report"], prs: [], comments: [],
      reporter: "CM: " + (r.reporter_name || "anonymous"),
      createdAt: now, updatedAt: now, updatedBy: myName(),
    };
    store.save(id, data)
      .then(() => store.updateReport(r.id, { status: "accepted" }))
      .then(() => {
        issues.push(Object.assign({ id }, data));
        reports = reports.filter(x => x.id !== r.id);
        toast(id + " created from the report");
        render();
        openReportsDrawer();
      })
      .catch(err => toast("Accept failed: " + err.message));
  }));
  document.querySelectorAll("#drawer [data-dismiss]").forEach(b => b.addEventListener("click", () => {
    const rid = b.dataset.dismiss;
    store.updateReport(rid, { status: "dismissed" })
      .then(() => {
        reports = reports.filter(x => String(x.id) !== rid);
        toast("Report dismissed");
        render();
        openReportsDrawer();
      })
      .catch(err => toast("Dismiss failed: " + err.message));
  }));
}

function openReportForm() {
  drawerId = null;
  let savedName = "";
  try { savedName = localStorage.getItem("sphub-tracker-cmname") || ""; } catch (e) {}
  $("#drawer").innerHTML =
    '<div class="drawer-head"><h2>Report an issue</h2>' +
    '<button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>' +
    '<div class="drawer-body">' +
    '<p class="viewer-note" style="margin:0 0 16px">Your report goes to the SP tech team for review. If accepted, it becomes a tracked issue.</p>' +
    '<div class="field"><label for="rName">Your name</label><input id="rName" value="' + esc(savedName) + '" placeholder="So the team knows who to ask"></div>' +
    '<div class="field"><label for="rKind">Type</label><select id="rKind">' +
    '<option value="bug">Bug — something is broken</option>' +
    '<option value="enhancement">Enhancement — something could be better</option></select></div>' +
    '<div class="field"><label for="rTitle">What needs to happen?</label><input id="rTitle" placeholder="One clear statement — e.g. Fix broken image upload in SPHUB news editor"></div>' +
    '<div class="field"><label for="rDesc">Details</label><textarea id="rDesc" placeholder="Where it happens, what you expected, steps to reproduce…"></textarea></div>' +
    "</div>" +
    '<div class="drawer-foot"><button class="btn" id="dCancel" style="margin-left:auto">Cancel</button>' +
    '<button class="btn primary" id="rSubmit">Submit report</button></div>';

  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#dClose").onclick = closeDrawer;
  $("#dCancel").onclick = closeDrawer;
  $("#rName").focus();
  $("#rSubmit").onclick = () => {
    const title = $("#rTitle").value.trim();
    const name = $("#rName").value.trim();
    if (!title) { toast("Describe what needs to happen"); $("#rTitle").focus(); return; }
    try { localStorage.setItem("sphub-tracker-cmname", name); } catch (e) {}
    store.addReport({
      title,
      description: $("#rDesc").value.trim(),
      reporter_name: name,
      kind: $("#rKind").value,
      status: "pending",
    }).then(() => {
      toast("Report submitted — the team will review it");
      closeDrawer();
      refresh(false);
    }).catch(err => toast("Submit failed: " + err.message));
  };
}

/* ---------------- wiring ---------------- */
$("#btnNew").addEventListener("click", () => openDrawer(null));
$("#btnReports").addEventListener("click", openReportsDrawer);
$("#btnPw").addEventListener("click", openPasswordDrawer);
$("#btnReport").addEventListener("click", openReportForm);
$("#btnTeam").addEventListener("click", openTeamDrawer);
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
});
$("#fSearch").addEventListener("input", e => { filters.q = e.target.value; render(); });
$("#fType").addEventListener("change", e => { filters.type = e.target.value; render(); });
$("#fPriority").addEventListener("change", e => { filters.priority = e.target.value; render(); });
$("#fAssignee").addEventListener("change", e => { filters.assignee = e.target.value; render(); });
$("#fStatus").addEventListener("change", e => { filters.status = e.target.value; render(); });
$("#fMine").addEventListener("click", () => {
  if (!me) { toast("Pick who you are first (it appears when the team list loads)"); return; }
  filters.mine = !filters.mine;
  render();
});
$("#clearFilters").addEventListener("click", () => {
  filters.q = filters.type = filters.priority = filters.assignee = filters.status = "";
  filters.mine = false;
  $("#fSearch").value = ""; $("#fType").value = ""; $("#fPriority").value = "";
  $("#fAssignee").value = ""; $("#fStatus").value = "";
  render();
});
$("#viewBoard").addEventListener("click", () => setView("board"));
$("#viewTable").addEventListener("click", () => setView("table"));
function setView(v) {
  view = v;
  $("#viewBoard").classList.toggle("on", v === "board");
  $("#viewTable").classList.toggle("on", v === "table");
  $("#viewBoard").setAttribute("aria-selected", v === "board");
  $("#viewTable").setAttribute("aria-selected", v === "table");
  render();
}

/* ---------------- boot ---------------- */
if (session) enterApp(); else showLogin();
</script>
</body>
</html>
